name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publiceer naar GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        shell: bash
        continue-on-error: true
        run: |
          npm run build
          node --test dist/test

      - name: Sync GitHub repository metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-repository.js

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run clean
          npm run build
          node node_modules/electron-builder/cli.js --win nsis --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Video-Compressor-*-Setup.exe
            release/Video-Compressor-*-Setup.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/Video-Compressor-*-Setup.exe
            release/Video-Compressor-*-Setup.exe.blockmap
            release/latest.yml
